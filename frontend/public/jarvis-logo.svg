<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="60%" stop-color="#060911" />
      <stop offset="100%" stop-color="#020307" />
    </radialGradient>

    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffcc" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>

    <radialGradient id="coreLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#00ffcc" />
      <stop offset="80%" stop-color="#0284c7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bgGrad)" stroke="url(#shieldBorder)" stroke-width="4" />
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#00ffcc" stroke-opacity="0.15" stroke-width="1" />

  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#cyanBlue)" stroke-width="2" stroke-dasharray="12 8 36 8 20 10" opacity="0.6" />
  <circle cx="256" cy="256" r="196" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 16 48 12" opacity="0.4" />

  <g stroke="#00ffcc" stroke-width="2" opacity="0.5">
    <line x1="256" y1="48" x2="256" y2="60" />
    <line x1="256" y1="452" x2="256" y2="464" />
    <line x1="48" y1="256" x2="60" y2="256" />
    <line x1="452" y1="256" x2="464" y2="256" />
  </g>

  <circle cx="256" cy="256" r="120" fill="url(#coreLight)" filter="url(#cyanGlow)" />
  <circle cx="256" cy="256" r="136" fill="none" stroke="url(#cyanBlue)" stroke-width="3" filter="url(#coreGlow)" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="#00ffcc" stroke-width="2" stroke-dasharray="40 10 20 10" />

  <polygon points="256,156 342.6,306 169.4,306" fill="none" stroke="url(#cyanBlue)" stroke-width="3" stroke-linejoin="round" filter="url(#coreGlow)" opacity="0.9" />
  <polygon points="256,356 169.4,206 342.6,206" fill="none" stroke="#00ffcc" stroke-width="1.5" stroke-linejoin="round" opacity="0.5" />

  <g filter="url(#coreGlow)">
    <path d="M 210,226 L 176,256 L 210,286" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 302,226 L 336,256 L 302,286" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="272" y1="218" x2="240" y2="294" stroke="#00ffcc" stroke-width="6" stroke-linecap="round" />
  </g>

  <circle cx="256" cy="120" r="5" fill="#00ffcc" filter="url(#coreGlow)" />
  <circle cx="372" cy="323" r="5" fill="#38bdf8" filter="url(#coreGlow)" />
  <circle cx="140" cy="323" r="5" fill="#6366f1" filter="url(#coreGlow)" />
</svg>

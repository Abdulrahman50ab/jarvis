<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JARVIS Assistant</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fffafa;
        color: #18181b;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          linear-gradient(rgba(220, 38, 38, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(220, 38, 38, 0.05) 1px, transparent 1px),
          radial-gradient(circle at top, rgba(220, 38, 38, 0.12), transparent 42%),
          #fffafa;
        background-size: 40px 40px, 40px 40px, auto, auto;
      }
      main {
        width: min(480px, 100%);
        padding: 40px;
        text-align: center;
        border: 1px solid rgba(185, 28, 28, 0.14);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 28px 90px rgba(127, 29, 29, 0.16);
      }
      .mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 24px;
        display: block;
        border-radius: 22px;
        box-shadow: 0 12px 40px rgba(185, 28, 28, 0.22);
      }
      h1 { margin: 0; letter-spacing: 0.18em; font-size: 22px; }
      p { margin: 14px 0 0; color: #71717a; line-height: 1.7; }
      code { color: #dc2626; }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="./icons/jarvis.svg" alt="JARVIS logo" />
      <h1>JARVIS</h1>
      <p>
        The application interface is missing. Rebuild the Windows package with
        <code>npm run package-win</code>.
      </p>
    </main>
  </body>
</html>

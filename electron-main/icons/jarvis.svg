<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fff1f2" />
    </linearGradient>
    <linearGradient id="jarvisRed" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="45%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="redGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#991b1b" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect x="18" y="18" width="476" height="476" rx="104" fill="url(#card)" stroke="#dc2626" stroke-width="6" filter="url(#cardShadow)" />
  <rect x="31" y="31" width="450" height="450" rx="92" fill="none" stroke="#fecaca" stroke-width="2" />

  <circle cx="256" cy="256" r="190" fill="#dc2626" opacity="0.045" />
  <circle cx="256" cy="256" r="178" fill="none" stroke="url(#jarvisRed)" stroke-width="4" stroke-dasharray="22 12 5 12" opacity="0.75" />
  <circle cx="256" cy="256" r="146" fill="none" stroke="#fca5a5" stroke-width="2" stroke-dasharray="8 10" />

  <g stroke="#dc2626" stroke-width="5" stroke-linecap="round">
    <line x1="256" y1="58" x2="256" y2="78" />
    <line x1="256" y1="434" x2="256" y2="454" />
    <line x1="58" y1="256" x2="78" y2="256" />
    <line x1="434" y1="256" x2="454" y2="256" />
  </g>

  <circle cx="256" cy="256" r="106" fill="url(#jarvisRed)" filter="url(#redGlow)" />
  <circle cx="256" cy="256" r="86" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.32" />

  <path
    d="M 215 198 H 304 V 278 C 304 329 276 350 235 350 C 196 350 174 328 172 294"
    fill="none"
    stroke="#ffffff"
    stroke-width="22"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <circle cx="256" cy="106" r="7" fill="#dc2626" />
  <circle cx="386" cy="331" r="7" fill="#ef4444" />
  <circle cx="126" cy="331" r="7" fill="#f87171" />
</svg>
